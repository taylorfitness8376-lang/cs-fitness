<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS Performance HYROX — Race Director &amp; Sim Console</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050806;
      --surface: #0d140f;
      --surface-2: #131e16;
      --border: rgba(61, 255, 79, 0.24);
      --green: #3DFF4F;
      --yellow: #facc15;
      --blue: #38bdf8;
      --red: #f43f5e;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #0d2012 0%, var(--bg) 60%);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding-bottom: 4rem;
    }
    .topbar {
      background: rgba(8, 13, 10, 0.94);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--border);
      object-fit: contain;
    }
    .brand-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-style: italic;
      font-weight: 800;
      font-size: 1.6rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .brand-title span { color: var(--green); }
    .nav-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.52rem 0.9rem;
      border-radius: 9px;
      font-weight: 700;
      font-size: 0.82rem;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: var(--surface-2);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--green); }
    .btn-green {
      background: var(--green);
      color: #041206;
      border-color: var(--green);
    }
    .btn-yellow {
      background: var(--yellow);
      color: #141102;
      border-color: var(--yellow);
    }
    .btn-red {
      background: rgba(244, 63, 94, 0.16);
      color: #fda4af;
      border-color: rgba(244, 63, 94, 0.4);
    }
    .container {
      max-width: 1520px;
      margin: 0.75rem auto;
      padding: 0 0.95rem;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      margin-bottom: 0.85rem;
    }
    @media (max-width: 960px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 0.95rem;
      margin-bottom: 0.65rem;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.55rem;
      padding-bottom: 0.45rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .card-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-style: italic;
      font-weight: 800;
      font-size: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 0.5rem;
      margin-bottom: 0.45rem;
      align-items: end;
    }
    .form-row > div, .quick-add-grid > div {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-width: 0;
    }
    label {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
      margin-bottom: 0.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    input, select, textarea {
      width: 100%;
      background: #070d09;
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: var(--text);
      padding: 0.35rem 0.55rem;
      border-radius: 7px;
      font-size: 0.8rem;
      font-family: inherit;
      height: 32px;
    }
    textarea {
      height: auto;
    }
    .day-tab-btn {
      background: var(--surface-2);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--muted);
      padding: 0.28rem 0.6rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      height: 28px;
    }
    .day-tab-btn.active {
      background: rgba(61, 255, 79, 0.16);
      border-color: var(--green);
      color: var(--green);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.76rem;
    }
    th, td {
      padding: 0.2rem 0.42rem;
      border: 1px solid rgba(255, 255, 255, 0.07);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }
    th {
      background: rgba(255, 255, 255, 0.04);
      font-size: 0.67rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-weight: 800;
      padding: 0.28rem 0.42rem;
    }
    tbody tr:hover td {
      background: rgba(61, 255, 79, 0.035);
    }
    .cell-input, .cell-select {
      height: 24px;
      padding: 0.1rem 0.32rem;
      font-size: 0.74rem;
      border-radius: 4px;
      background: rgba(7, 13, 9, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.11);
    }
    .cell-input:focus, .cell-select:focus {
      outline: none;
      border-color: var(--green);
      background: #070d09;
    }
    .btn-xs {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      height: 22px;
      padding: 0 0.42rem;
      border-radius: 5px;
      font-weight: 700;
      font-size: 0.69rem;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: var(--surface-2);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
    }
    .btn-xs:hover { border-color: var(--green); }
    .btn-xs.btn-green {
      background: var(--green);
      color: #041206;
      border-color: var(--green);
    }
    .btn-xs.btn-red {
      background: rgba(244, 63, 94, 0.16);
      color: #fda4af;
      border-color: rgba(244, 63, 94, 0.4);
    }
    .pill {
      display: inline-block;
      padding: 0.1rem 0.38rem;
      border-radius: 4px;
      font-weight: 800;
      font-size: 0.66rem;
      text-transform: uppercase;
    }
    .status-racing { background: rgba(61, 255, 79, 0.18); color: var(--green); }
    .status-finished { background: rgba(56, 189, 248, 0.18); color: var(--blue); }
    .status-scheduled { background: rgba(250, 204, 21, 0.16); color: var(--yellow); }

    /* Modal for Split Corrections & Combined Segment Splitter */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--green);
      border-radius: 16px;
      max-width: 880px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.25rem;
    }
    .splits-edit-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.55rem;
      margin: 0.85rem 0;
    }
    @media (max-width: 680px) {
      .splits-edit-grid { grid-template-columns: 1fr; }
    }
    .split-edit-item {
      background: var(--surface-2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9px;
      padding: 0.5rem 0.65rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/static/logo.jpg" alt="CS Fitness" class="brand-logo" style="width:44px;height:44px" />
      <div style="display:flex;flex-direction:column;justify-content:center">
        <div class="brand-title" style="line-height:1">CS <span>FITNESS</span></div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:900;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);line-height:1.05;margin-top:0.1rem">HYROX SIM · RACE DIRECTOR</div>
      </div>
    </div>
    <div class="nav-actions">
      <select id="event-selector" onchange="switchEvent(this.value)" style="width:auto;min-width:220px;height:40px;font-weight:700"></select>
      <a href="/hyrox/judge" target="_blank" class="btn btn-yellow" style="height:40px">⏱️ Judge</a>
      <a href="/hyrox/tv" target="_blank" class="btn btn-green" style="height:40px">📺 Live Timings</a>
      <a href="/hyrox/tv/finisher" target="_blank" class="btn" style="height:40px;border-color:var(--green);color:var(--green)">📸 Finishers</a>
      <a href="/" class="btn" style="height:40px">🏠 Home</a>
    </div>
  </header>

  <main class="container">
    <!-- ================================================================= -->
    <!-- ADD ATHLETE / PAIR                                                -->
    <!-- ================================================================= -->
    <section class="card" style="padding:0.75rem 1rem">
      <div style="display:grid;grid-template-columns:1.5fr 1.15fr 1.05fr 0.95fr 1.2fr auto;gap:0.5rem;align-items:end">
        <div>
          <label>Athlete / Pair</label>
          <input type="text" id="qa-name" placeholder="Name or Pair (use &amp;)" onkeydown="if(event.key==='Enter'){event.preventDefault();quickAddEntry();}" />
        </div>
        <div>
          <label>Category</label>
          <select id="qa-division">
            <option value="men_open">Male Solo (Open)</option>
            <option value="men_doubles">Male Doubles</option>
            <option value="mixed_doubles">Mixed Doubles</option>
            <option value="women_open">Female Solo (Open)</option>
            <option value="women_doubles">Female Doubles</option>
            <option value="men_pro">Male Solo (Pro)</option>
            <option value="men_pro_doubles">Male Pro Doubles</option>
            <option value="women_pro">Female Solo (Pro)</option>
            <option value="women_pro_doubles">Female Pro Doubles</option>
          </select>
        </div>
        <div>
          <label>Time Slot</label>
          <select id="qa-heat"></select>
        </div>
        <div>
          <label>Volunteer</label>
          <input type="text" id="qa-volunteer" placeholder="Judge" onkeydown="if(event.key==='Enter'){event.preventDefault();quickAddEntry();}" />
        </div>
        <div>
          <label>Email</label>
          <input type="email" id="qa-email" placeholder="athlete@email.com" onkeydown="if(event.key==='Enter'){event.preventDefault();quickAddEntry();}" />
        </div>
        <div>
          <button type="button" class="btn btn-green" style="height:36px;padding:0 1rem;justify-content:center" onclick="quickAddEntry()">+ Add</button>
        </div>
      </div>
    </section>

    <!-- ================================================================= -->
    <!-- ATHLETES & RESULTS                                                -->
    <!-- ================================================================= -->
    <section class="card">
      <div class="card-header" style="margin-bottom:0.6rem">
        <div class="card-title">ATHLETES &amp; RESULTS</div>
        <div style="display:flex;gap:0.4rem;align-items:center;flex-wrap:wrap">
          <input type="text" id="filter-search" placeholder="Search..." oninput="renderEntriesTable()" style="width:170px;height:34px;font-size:0.76rem" />
          <button type="button" class="day-tab-btn active" data-day="all" onclick="setAdminDayFilter('all')">All</button>
          <button type="button" class="day-tab-btn" data-day="1" onclick="setAdminDayFilter('1')">Sat</button>
          <button type="button" class="day-tab-btn" data-day="2" onclick="setAdminDayFilter('2')">Sun</button>
          <select id="filter-signup-group" onchange="renderEntriesTable()" style="width:auto;height:34px;font-size:0.76rem;font-weight:700;border-color:rgba(61,255,79,0.35)">
            <option value="all">All Groups</option>
            <option value="male_solo">Male Solo</option>
            <option value="male_mixed_doubles">Male / Mixed Doubles</option>
            <option value="female_solo">Female Solo</option>
            <option value="female_doubles">Female Doubles</option>
          </select>
          <select id="filter-division" onchange="renderEntriesTable()" style="display:none">
            <option value="all">All Categories</option>
            {% for div_key, div in divisions.items() %}
            <option value="{{ div_key }}">{{ div.label }}</option>
            {% endfor %}
          </select>
          <select id="filter-status" onchange="renderEntriesTable()" style="display:none">
            <option value="all">All Statuses</option>
            <option value="finished">Finished Only</option>
            <option value="active">Racing / Finished</option>
          </select>
          <button type="button" class="btn btn-green" style="height:34px;padding:0 0.65rem" onclick="setupWeekendEvent(false)">⚡ Sync TeamUp</button>
          <button type="button" class="btn" style="height:34px;padding:0 0.65rem" onclick="copyAllResultsLinks(this)">📋 Copy Links</button>
          <button type="button" class="btn" style="height:34px;padding:0 0.65rem" onclick="refreshEventState()">🔄</button>
        </div>
      </div>
      <div id="wk-setup-status" style="font-size:0.75rem;color:var(--muted);margin-bottom:0.55rem;display:none"></div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Slot</th>
              <th>Athlete / Pair</th>
              <th>Category</th>
              <th>Volunteer</th>
              <th>Email</th>
              <th>Status / Time</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="entries-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- ================================================================= -->
    <!-- COLLAPSIBLE EVENT SETUP, TEAMUP & CSV IMPORT                      -->
    <!-- ================================================================= -->
    <details class="card" style="padding:0.75rem 1rem">
      <summary style="cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:0.98rem;color:var(--muted);letter-spacing:0.04em;text-transform:uppercase">
        ⚙️ Event Setup, TeamUp &amp; CSV Import
      </summary>
      <div style="margin-top:0.8rem">
        <div class="form-row" style="margin-bottom:0.55rem">
          <div>
            <label>Event Name</label>
            <input type="text" id="wk-ev-name" placeholder="CS Fitness HYROX Sim" />
          </div>
          <div>
            <label>Saturday (14:00–17:00)</label>
            <input type="date" id="wk-sat-date" value="2026-11-28" />
          </div>
          <div>
            <label>Sunday (10:00–14:00)</label>
            <input type="date" id="wk-sun-date" value="2026-11-29" />
          </div>
          <div>
            <label>Slot Interval (mins)</label>
            <input type="number" id="wk-interval" value="5" min="1" max="60" />
          </div>
        </div>
        <div style="display:flex;gap:0.45rem;flex-wrap:wrap;align-items:center;margin-bottom:0.85rem">
          <button type="button" class="btn btn-green" onclick="setupWeekendEvent(false)">⚡ Setup Event &amp; Sync TeamUp</button>
          <button type="button" class="btn" onclick="setupWeekendEvent(true)">🧱 Apply Slots</button>
          <button type="button" class="btn btn-yellow" onclick="checkLiveTeamUpSignups()">📡 Check TeamUp</button>
          <button type="button" class="btn" onclick="setWeekendDatePreset('2026-11-28','2026-11-29')">Nov 2026</button>
          <button type="button" class="btn" onclick="setWeekendDatePreset('2027-02-20','2027-02-21')">Feb 2027</button>
          <button type="button" class="btn" onclick="setUpcomingWeekendPreset()">Next Weekend</button>
          <button type="button" class="btn btn-red" style="margin-left:auto" onclick="clearAllEntries()">🗑️ Clear Entries</button>
        </div>

        <div class="grid-2" style="margin-bottom:0">
          <!-- Custom Event & Block Generator -->
          <div style="background:var(--surface-2);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:0.75rem">
            <div style="font-size:0.76rem;font-weight:800;color:var(--muted);text-transform:uppercase;margin-bottom:0.45rem">
              Custom Slots &amp; Events
            </div>
            <div class="form-row">
              <div>
                <label>New Event Name</label>
                <input type="text" id="new-ev-name" placeholder="HYROX Sim" />
              </div>
              <div>
                <label>Start Date</label>
                <input type="date" id="new-ev-date" value="2026-11-28" />
              </div>
              <div>
                <label>Days</label>
                <select id="new-ev-days">
                  <option value="2" selected>2 Days</option>
                  <option value="1">1 Day</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div>
                <label>Start</label>
                <input type="time" id="new-ev-time" value="14:00" />
              </div>
              <div>
                <label>Slots</label>
                <input type="number" id="new-ev-waves" value="6" min="1" max="40" />
              </div>
              <div>
                <label>Gap (m)</label>
                <input type="number" id="new-ev-interval" value="5" min="1" max="90" />
              </div>
              <div>
                <label>Buffer (m)</label>
                <input type="number" id="new-ev-buffer" value="10" min="0" max="60" />
              </div>
            </div>
            <button type="button" class="btn btn-green" style="margin-bottom:0.65rem" onclick="createNewSimEvent()">+ Create Event</button>

            <div style="border-top:1px solid rgba(255,255,255,0.08);padding-top:0.55rem">
              <div class="form-row" style="margin-bottom:0.45rem">
                <div>
                  <label>Day</label>
                  <select id="blk-day">
                    <option value="1">Sat</option>
                    <option value="2">Sun</option>
                  </select>
                </div>
                <div>
                  <label>Category</label>
                  <select id="blk-division">
                    {% for div_key, div in divisions.items() %}
                    <option value="{{ div_key }}">{{ div.label }}</option>
                    {% endfor %}
                  </select>
                </div>
                <div>
                  <label>Start</label>
                  <input type="time" id="blk-start" value="14:00" />
                </div>
                <div>
                  <label>Slots</label>
                  <input type="number" id="blk-count" value="4" min="1" max="20" />
                </div>
                <div>
                  <label>Gap (m)</label>
                  <input type="number" id="blk-gap" value="5" min="1" max="90" />
                </div>
              </div>
              <button type="button" class="btn" onclick="addWavesToCurrentEvent()">+ Add Slots</button>
            </div>
          </div>

          <!-- TeamUp API & CSV Import -->
          <div style="background:var(--surface-2);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:0.75rem">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.45rem">
              <div style="font-size:0.76rem;font-weight:800;color:var(--muted);text-transform:uppercase">
                TeamUp API &amp; CSV
              </div>
              <div style="display:flex;gap:0.35rem;align-items:center">
                <span id="teamup-api-badge" class="pill" style="background:rgba(255,255,255,0.08);color:var(--muted)">Ready</span>
                <a href="/api/hyrox/sample-csv" class="btn" style="padding:0.18rem 0.45rem;font-size:0.68rem" download>Sample CSV</a>
              </div>
            </div>
            <div class="form-row" style="margin-bottom:0.45rem">
              <div>
                <label>API Token</label>
                <input type="password" id="tu-api-token" placeholder="TeamUp Key" />
              </div>
              <div>
                <label>Provider ID</label>
                <input type="text" id="tu-provider-id" value="13050192" />
              </div>
            </div>
            <div class="form-row" style="margin-bottom:0.45rem">
              <div>
                <label>Class Filter</label>
                <select id="tu-event-select">
                  <option value="">All Classes</option>
                </select>
              </div>
              <div style="display:flex;align-items:flex-end">
                <button type="button" class="btn" onclick="loadRemoteTeamUpEvents()" style="width:100%">Load Classes</button>
              </div>
            </div>
            <input type="checkbox" id="tu-auto-stagger" style="display:none" checked />
            <div style="display:flex;gap:0.4rem;flex-wrap:wrap;align-items:center;margin-bottom:0.55rem">
              <button type="button" class="btn" onclick="saveAndTestTeamUpApi()">Save Token</button>
              <button type="button" class="btn btn-green" onclick="syncFromTeamUpApi()">Sync TeamUp</button>
              <span id="tu-status-msg" style="font-size:0.7rem;color:var(--muted)"></span>
            </div>
            <div style="border-top:1px solid rgba(255,255,255,0.08);padding-top:0.5rem">
              <div style="display:flex;gap:0.4rem;margin-bottom:0.35rem">
                <input type="file" id="csv-file-input" accept=".csv,text/csv" onchange="loadCsvFile(this)" style="font-size:0.7rem" />
                <button type="button" class="btn btn-green" style="flex-shrink:0" onclick="importTeamUpCsv()">Import CSV</button>
              </div>
              <textarea id="csv-text-input" rows="2" style="font-size:0.72rem" placeholder="First Name,Last Name,Email,DOB,Division,Partner Name,Heat Time,Volunteer"></textarea>
            </div>
          </div>
        </div>
      </div>
    </details>
  </main>

  <!-- MODAL: EDIT ATHLETE & SPLITS -->
  <div class="modal-backdrop" id="splits-modal">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem">
        <div>
          <div class="card-title" id="modal-entry-title">Edit Athlete</div>
          <div style="font-size:0.76rem;color:var(--muted)" id="modal-entry-subtitle"></div>
        </div>
        <button type="button" class="btn" onclick="closeSplitsModal()">✕</button>
      </div>

      <div style="background:var(--surface-2);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:0.75rem;margin-bottom:0.75rem">
        <div class="form-row">
          <div>
            <label>Athlete</label>
            <input type="text" id="modal-display-name" placeholder="Full Name" />
          </div>
          <div>
            <label>Partner (Doubles)</label>
            <input type="text" id="modal-partner-name" placeholder="Optional" oninput="onModalPartnerInput(this.value)" />
          </div>
          <div>
            <label>Category</label>
            <select id="modal-division">
              <option value="women_open">Female Open (F Open)</option>
              <option value="women_doubles">Female Doubles (F Doubles)</option>
              <option value="women_pro">Female Pro (F Pro)</option>
              <option value="women_pro_doubles">Female Pro Doubles (F Pro Dbl)</option>
              <option value="men_open">Men&#39;s Open (M Open)</option>
              <option value="men_doubles">Men&#39;s Open Doubles (M Open Dbl)</option>
              <option value="mixed_doubles">Mixed Doubles (Mixed Dbl)</option>
              <option value="men_pro">Men&#39;s Pro (M Pro)</option>
              <option value="men_pro_doubles">Men&#39;s Pro Doubles (M Pro Dbl)</option>
            </select>
          </div>
        </div>
        <div class="form-row" style="margin-bottom:0">
          <div>
            <label>Slot</label>
            <select id="modal-heat-id"></select>
          </div>
          <div>
            <label>Custom Time</label>
            <div style="display:flex;gap:0.35rem">
              <select id="modal-custom-day" style="width:76px">
                <option value="1">Sat</option>
                <option value="2">Sun</option>
              </select>
              <input type="text" id="modal-custom-time" placeholder="HH:MM" style="flex:1" />
            </div>
          </div>
          <div>
            <label>Volunteer</label>
            <input type="text" id="modal-volunteer" placeholder="Judge" />
          </div>
          <div>
            <label>Email</label>
            <input type="hidden" id="modal-bib" />
            <input type="email" id="modal-email" placeholder="athlete@email.com" />
          </div>
        </div>
      </div>

      <div class="form-row" style="margin-bottom:0.65rem">
        <div>
          <label>Status</label>
          <select id="modal-status">
            <option value="scheduled">scheduled</option>
            <option value="racing">racing</option>
            <option value="finished">finished</option>
            <option value="dns">dns</option>
            <option value="dnf">dnf</option>
          </select>
        </div>
        <div>
          <label>Penalty (MM:SS)</label>
          <input type="text" id="modal-penalty" placeholder="00:00" />
        </div>
        <div>
          <label>Wall Ball Reps</label>
          <input type="number" id="modal-wb-reps" min="0" max="200" />
        </div>
        <div>
          <label>Notes</label>
          <input type="text" id="modal-notes" placeholder="Notes" />
        </div>
      </div>

      <!-- Collapsible Split Segment Helper -->
      <details style="background:rgba(250,204,21,0.06);border:1px solid rgba(250,204,21,0.28);border-radius:9px;padding:0.5rem 0.7rem;margin-bottom:0.65rem">
        <summary style="cursor:pointer;font-size:0.74rem;font-weight:800;color:var(--yellow);text-transform:uppercase">
          ✂️ Split a Combined Segment
        </summary>
        <div class="form-row" style="margin-top:0.5rem;margin-bottom:0">
          <div>
            <label>First Split</label>
            <select id="comb-first-idx"></select>
          </div>
          <div>
            <label>Combined (MM:SS)</label>
            <input type="text" id="comb-total-str" placeholder="07:45" />
          </div>
          <div>
            <label>First Split (MM:SS)</label>
            <input type="text" id="comb-first-str" placeholder="04:10" />
          </div>
          <div style="display:flex;align-items:flex-end">
            <button type="button" class="btn btn-yellow" onclick="applyCombinedSplit()">Split</button>
          </div>
        </div>
      </details>

      <div class="splits-edit-grid" id="modal-splits-grid"></div>

      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;margin-top:0.75rem">
        <div style="display:flex;gap:0.4rem">
          <button type="button" class="btn btn-red" onclick="deleteCurrentEntry()">Delete</button>
          <button type="button" class="btn" onclick="resetEntryTimer()">Reset Timer</button>
        </div>
        <div style="display:flex;gap:0.5rem">
          <button type="button" class="btn" onclick="closeSplitsModal()">Cancel</button>
          <button type="button" class="btn btn-green" onclick="saveSplitCorrections()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentEventId = {{ active_event_id or 'null' }};
    let currentState = null;
    let editingEntry = null;
    let adminDayFilter = 'all';

    function setAdminDayFilter(dayVal) {
      adminDayFilter = dayVal;
      document.querySelectorAll('.day-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-day') === dayVal);
      });
      renderEntriesTable();
    }

    async function loadEventsList() {
      const res = await fetch('/api/hyrox/events');
      const events = await res.json();
      const sel = document.getElementById('event-selector');
      if (!currentEventId && events.length) currentEventId = events[0].id;
      sel.innerHTML = events.map(ev =>
        `<option value="${ev.id}" ${ev.id === currentEventId ? 'selected' : ''}>${ev.name} (${ev.event_date}${ev.end_date && ev.end_date !== ev.event_date ? ' → ' + ev.end_date : ''}) · ${ev.entry_count} entries</option>`
      ).join('');
      if (currentEventId) await refreshEventState();
    }

    async function switchEvent(evId) {
      currentEventId = parseInt(evId, 10);
      await refreshEventState();
    }

    async function refreshEventState() {
      if (!currentEventId) return;
      const res = await fetch(`/api/hyrox/events/${currentEventId}/state`);
      if (!res.ok) return;
      currentState = await res.json();
      populateHeatDropdown();
      renderEntriesTable();
    }

    function initWeekendSetupDates() {
      const satInput = document.getElementById('wk-sat-date');
      const sunInput = document.getElementById('wk-sun-date');
      if (satInput && !satInput.value) satInput.value = '2026-11-28';
      if (sunInput && !sunInput.value) sunInput.value = '2026-11-29';
    }

    function setWeekendDatePreset(satIso, sunIso) {
      const satInput = document.getElementById('wk-sat-date');
      const sunInput = document.getElementById('wk-sun-date');
      if (satInput) satInput.value = satIso;
      if (sunInput) sunInput.value = sunIso;
      checkLiveTeamUpSignups(false);
    }

    function setUpcomingWeekendPreset() {
      const now = new Date();
      const dayOfWeek = now.getDay();
      const daysUntilSat = (6 - dayOfWeek + 7) % 7;
      const sat = new Date(now);
      sat.setDate(now.getDate() + daysUntilSat);
      const sun = new Date(sat);
      sun.setDate(sat.getDate() + 1);
      const toIso = d => d.toISOString().slice(0, 10);
      setWeekendDatePreset(toIso(sat), toIso(sun));
    }

    async function setupWeekendEvent(useCurrentEvent) {
      initWeekendSetupDates();
      const satDate = document.getElementById('wk-sat-date').value;
      const sunDate = document.getElementById('wk-sun-date').value;
      const intervalMins = parseInt(document.getElementById('wk-interval').value || '5', 10);
      const customName = document.getElementById('wk-ev-name').value.trim();
      const statusEl = document.getElementById('wk-setup-status');
      statusEl.style.display = 'block';
      statusEl.innerHTML = `<span style="color:var(--yellow)">⏳ Setting up Saturday (${satDate} 14:00–17:00) &amp; Sunday (${sunDate} 10:00–14:00) slots...</span>`;

      const payload = {
        saturday_date: satDate,
        sunday_date: sunDate,
        interval_mins: intervalMins,
        sync_teamup: true,
      };
      if (customName) payload.name = customName;
      if (useCurrentEvent && currentEventId) payload.event_id = currentEventId;

      const res = await fetch('/api/hyrox/events/setup-weekend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        currentEventId = data.event.id;
        const syncNote = data.synced_count
          ? ` · Synced <strong>${data.synced_count}</strong> TeamUp sign-ups!`
          : (data.teamup_sync_error ? ` · TeamUp note: ${escapeHtml(data.teamup_sync_error)}` : '');
        statusEl.innerHTML = `<span style="color:var(--green);font-weight:700">✅ Ready: ${escapeHtml(data.event.name)} (${data.heats_total_count} slots across Sat 14:00–17:00 &amp; Sun 10:00–14:00)${syncNote}</span>`;
        await loadEventsList();
      } else {
        statusEl.innerHTML = `<span style="color:var(--red)">❌ ${escapeHtml(data.error || 'Could not set up weekend event')}</span>`;
      }
    }

    async function checkLiveTeamUpSignups(silentIfEmpty = false) {
      initWeekendSetupDates();
      const satDate = document.getElementById('wk-sat-date').value;
      const sunDate = document.getElementById('wk-sun-date').value;
      const statusEl = document.getElementById('wk-setup-status');
      if (!silentIfEmpty) {
        statusEl.style.display = 'block';
        statusEl.innerHTML = `<span style="color:var(--blue)">📡 Querying TeamUp API v2 for sign-ups (${satDate} → ${sunDate})...</span>`;
      }

      const res = await fetch(`/api/hyrox/teamup/signups?saturday_date=${encodeURIComponent(satDate)}&sunday_date=${encodeURIComponent(sunDate)}`);
      const data = await res.json();
      if (res.ok && data.ok) {
        if (data.saturday_date) document.getElementById('wk-sat-date').value = data.saturday_date;
        if (data.sunday_date) document.getElementById('wk-sun-date').value = data.sunday_date;
        if (data.total_signups > 0 || !silentIfEmpty) {
          statusEl.style.display = 'block';
          statusEl.innerHTML = data.total_signups > 0
            ? `<span style="color:var(--green);font-weight:700">✅ Found ${data.total_signups} live TeamUp sign-ups (${data.saturday_date} → ${data.sunday_date}). Click "⚡ Setup Event &amp; Sync TeamUp" to import &amp; assign slots!</span>`
            : `<span style="color:var(--yellow)">ℹ️ TeamUp API connected (${data.remote_events_count || 0} classes checked for ${data.saturday_date} → ${data.sunday_date}; 0 HYROX sim registrations returned by TeamUp yet).</span>`;
        }
      } else if (!silentIfEmpty) {
        statusEl.style.display = 'block';
        statusEl.innerHTML = `<span style="color:var(--yellow)">ℹ️ ${escapeHtml(data.error || 'TeamUp API not connected yet — displaying current event sign-ups in Section 3 below.')}</span>`;
      }
    }

    function populateHeatDropdown() {
      const sel = document.getElementById('qa-heat');
      if (!sel) return;
      const heats = currentState?.heats || [];
      sel.innerHTML = `<option value="">Auto Slot</option>` + heats.map(h => {
        const dayShort = (h.day_number || 1) === 2 ? 'Sun' : 'Sat';
        return `<option value="${h.id}">${dayShort} ${h.start_time}${h.assigned_lanes ? ' · Assigned' : ''}</option>`;
      }).join('');
    }

    function cleanSplitLabel(str) {
      return String(str || '').replace(/\s*\([^)]*\)/g, '').trim();
    }

    const ADMIN_DIVISIONS = [
      { key: 'women_open', label: 'Female Open', short: 'W-OPEN' },
      { key: 'women_doubles', label: 'Female Doubles', short: 'W-DBL' },
      { key: 'women_pro', label: 'Female Pro', short: 'W-PRO' },
      { key: 'women_pro_doubles', label: 'Female Pro Doubles', short: 'W-PRO-DBL' },
      { key: 'men_open', label: "Men's Open", short: 'M-OPEN' },
      { key: 'men_doubles', label: "Men's Open Doubles", short: 'M-DBL' },
      { key: 'mixed_doubles', label: 'Mixed Doubles', short: 'MIX-DBL' },
      { key: 'men_pro', label: "Men's Pro", short: 'M-PRO' },
      { key: 'men_pro_doubles', label: "Men's Pro Doubles", short: 'M-PRO-DBL' },
    ];

    const SIGNUP_GROUP_META = [
      { key: 'male_solo', title: 'MALE SOLO', day: '1', window: 'Sat 14:00–17:00', color: '#38bdf8' },
      { key: 'male_mixed_doubles', title: 'MALE / MIXED DOUBLES', day: '1', window: 'Sat 14:00–17:00', color: '#3dff4f' },
      { key: 'female_solo', title: 'FEMALE SOLO', day: '2', window: 'Sun 10:00–14:00', color: '#f472b6' },
      { key: 'female_doubles', title: 'FEMALE DOUBLES', day: '2', window: 'Sun 10:00–14:00', color: '#c084fc' },
    ];

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function inferGroupKeyForEntry(e) {
      if (e.signup_group) return e.signup_group;
      const div = e.division || '';
      if (div === 'men_open' || div === 'men_pro') return 'male_solo';
      if (div === 'men_doubles' || div === 'men_pro_doubles' || div === 'mixed_doubles') return 'male_mixed_doubles';
      if (div === 'women_open' || div === 'women_pro') return 'female_solo';
      if (div === 'women_doubles' || div === 'women_pro_doubles') return 'female_doubles';
      return 'male_solo';
    }

    function renderEntriesTable() {
      if (!currentState) return;
      const filterDiv = (document.getElementById('filter-division') || {}).value || 'all';
      const filterGroup = (document.getElementById('filter-signup-group') || {}).value || 'all';
      const filterStatus = (document.getElementById('filter-status') || {}).value || 'all';
      const searchQ = ((document.getElementById('filter-search') || {}).value || '').trim().toLowerCase();
      const heats = currentState.heats || [];

      const entries = (currentState.entries || []).filter(e => {
        if (adminDayFilter !== 'all' && String(e.heat_day_number || 1) !== String(adminDayFilter)) return false;
        const gKey = inferGroupKeyForEntry(e);
        if (filterGroup !== 'all' && gKey !== filterGroup) return false;
        if (filterDiv !== 'all' && e.division !== filterDiv) return false;
        if (filterStatus === 'finished' && e.status !== 'finished') return false;
        if (filterStatus === 'active' && !(e.status === 'finished' || e.status === 'racing' || (e.completed_splits || 0) > 0)) return false;
        if (searchQ) {
          const hay = `${e.full_display_name || ''} ${e.display_name || ''} ${e.partner_name || ''} ${e.email || ''} ${e.volunteer_name || ''}`.toLowerCase();
          if (!hay.includes(searchQ)) return false;
        }
        return true;
      });
      const tbody = document.getElementById('entries-tbody');

      if (!entries.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align:center;padding:1.5rem 1rem;color:var(--muted);font-size:0.84rem">
              No athletes yet. Add an athlete above or click <strong>Sync TeamUp</strong>.
            </td>
          </tr>
        `;
        return;
      }

      const rowsHtml = [];
      SIGNUP_GROUP_META.forEach(grp => {
        if (filterGroup !== 'all' && filterGroup !== grp.key) return;
        if (adminDayFilter !== 'all' && adminDayFilter !== grp.day) return;
        const grpEntries = entries.filter(e => inferGroupKeyForEntry(e) === grp.key);
        if (!grpEntries.length && (filterDiv !== 'all' || filterStatus !== 'all' || searchQ)) return;

        rowsHtml.push(`
          <tr>
            <td colspan="7" style="background:rgba(255,255,255,0.04);border-top:2px solid ${grp.color};border-bottom:1px solid rgba(255,255,255,0.1);padding:0.24rem 0.5rem">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:0.92rem;color:${grp.color};letter-spacing:0.03em">
                  ${grp.title}
                  <span style="color:var(--muted);font-weight:700;font-size:0.74rem;margin-left:0.35rem">(${grp.window})</span>
                </div>
                <span class="pill" style="background:rgba(255,255,255,0.08);color:${grp.color};font-weight:900">${grpEntries.length}</span>
              </div>
            </td>
          </tr>
        `);

        if (!grpEntries.length) {
          rowsHtml.push(`
            <tr>
              <td colspan="7" style="padding:0.3rem 0.5rem;color:var(--muted);font-size:0.73rem">
                No athletes in ${grp.title}.
              </td>
            </tr>
          `);
          return;
        }

        grpEntries.forEach(e => {
          const heatOpts = `<option value="">Unassigned</option>` + heats.map(h => {
            const dayShort = (h.day_number || 1) === 2 ? 'Sun' : 'Sat';
            return `<option value="${h.id}" ${e.heat_id === h.id ? 'selected' : ''}>${dayShort} ${h.start_time}</option>`;
          }).join('');

          const divOpts = ADMIN_DIVISIONS.map(d =>
            `<option value="${d.key}" ${e.division === d.key ? 'selected' : ''}>${d.label}</option>`
          ).join('');

          const statusClass = `status-${e.status}`;
          const relUrl = `/hyrox/results/${e.id}`;
          const fullUrl = `${window.location.origin}${relUrl}`;
          const splitsLines = (e.splits || [])
            .filter(s => s.duration_ms !== null && s.duration_ms !== undefined)
            .map(s => `  • ${cleanSplitLabel(s.label)}: ${s.duration_formatted}`)
            .join('\n');
          const breakdownBlock = splitsLines
            ? `\n--- 16-SPLIT BREAKDOWN ---\n` +
              `Run: ${e.run_total_formatted || '--:--'}${e.avg_run_kph_formatted ? ' (' + e.avg_run_kph_formatted + ')' : ''}\n` +
              `Workout: ${e.station_total_formatted || '--:--'}\n` +
              `${splitsLines}\n`
            : '';
          const mailSubject = encodeURIComponent(`CS Fitness HYROX Sim Results — ${e.full_display_name}`);
          const mailBody = encodeURIComponent(
            `Hi ${e.full_display_name},\n\n` +
            `Massive well done at the CS Fitness HYROX Sim! Train Hard & Be Sound.\n\n` +
            `Athlete: ${e.full_display_name}\n` +
            `Category: ${e.division_label}\n` +
            `Time: ${e.total_formatted}\n` +
            `${breakdownBlock}\n` +
            `Results & Social Card:\n` +
            `${fullUrl}\n`
          );
          const emailActionBtn = e.email
            ? `<a href="mailto:${encodeURIComponent(e.email)}?subject=${mailSubject}&body=${mailBody}" class="btn-xs" title="Email Results">✉️</a>`
            : '';

          const hasTime = (e.completed_splits || 0) > 0 || e.status === 'finished' || e.status === 'racing';
          const resultInlineHtml = hasTime
            ? `<strong style="font-family:'Barlow Condensed',sans-serif;font-size:0.95rem;color:var(--green);margin-left:0.35rem">${e.total_formatted}</strong>`
            : '';
          const progressInlineHtml = e.status === 'racing'
            ? `<span style="font-size:0.68rem;color:var(--muted);margin-left:0.2rem">${e.completed_splits}/16</span>`
            : '';

          rowsHtml.push(`
            <tr>
              <td style="width:105px">
                <select class="cell-select" onchange="updateEntryMeta(${e.id}, {heat_id: this.value})" style="width:100px">
                  ${heatOpts}
                </select>
              </td>
              <td style="font-weight:700;font-size:0.82rem">${escapeHtml(e.full_display_name)}</td>
              <td style="width:138px">
                <select class="cell-select" onchange="updateEntryMeta(${e.id}, {division: this.value})"
                  style="width:134px;font-weight:700;border-color:${e.division_color};color:${e.division_color}">
                  ${divOpts}
                </select>
              </td>
              <td style="width:125px">
                <input type="text" class="cell-input" value="${escapeHtml(e.volunteer_name || '')}" placeholder="Volunteer"
                  onchange="updateEntryMeta(${e.id}, {volunteer_name: this.value})"
                  style="width:120px" />
              </td>
              <td style="width:170px">
                <input type="email" class="cell-input" value="${escapeHtml(e.email || '')}" placeholder="athlete@email.com"
                  onchange="updateEntryMeta(${e.id}, {email: this.value})"
                  style="width:165px" />
              </td>
              <td style="text-align:center">
                <span class="pill ${statusClass}">${e.status}</span>
                ${progressInlineHtml}
                ${resultInlineHtml}
              </td>
              <td>
                <div style="display:flex;gap:0.25rem;flex-wrap:nowrap;align-items:center">
                  <a href="/hyrox/judge?entry=${e.id}" target="_blank" class="btn-xs" title="Judge Timer">Judge</a>
                  <button type="button" class="btn-xs" onclick="openSplitsModal(${e.id})" title="Edit Athlete &amp; Splits">Edit</button>
                  <a href="${relUrl}" target="_blank" class="btn-xs btn-green" title="Results &amp; Social Card">Results</a>
                  <button type="button" class="btn-xs" onclick="copyResultWebLink(${e.id}, this)" title="Copy Results Link">Link</button>
                  ${emailActionBtn}
                  <button type="button" class="btn-xs btn-red" title="Remove" onclick="quickDeleteEntry(${e.id})">✕</button>
                </div>
              </td>
            </tr>
          `);
        });
      });

      tbody.innerHTML = rowsHtml.join('');
    }

    function copyResultWebLink(entryId, btnEl) {
      const fullUrl = `${window.location.origin}/hyrox/results/${entryId}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(fullUrl);
      }
      if (btnEl) {
        const prev = btnEl.textContent;
        btnEl.textContent = '✅ Copied!';
        setTimeout(() => { btnEl.textContent = prev; }, 1600);
      }
    }

    function copyAllResultsLinks(btnEl) {
      const entries = currentState?.entries || [];
      if (!entries.length) return;
      const lines = entries.map(e =>
        `${e.full_display_name} (${e.division_label})${e.email ? ' <' + e.email + '>' : ''}: ${window.location.origin}/hyrox/results/${e.id}`
      ).join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lines);
      }
      if (btnEl) {
        const prev = btnEl.textContent;
        btnEl.textContent = `✅ Copied ${entries.length} Links!`;
        setTimeout(() => { btnEl.textContent = prev; }, 1800);
      }
    }

    async function updateEntryMeta(entryId, patch) {
      const res = await fetch(`/api/hyrox/entries/${entryId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(patch),
      });
      const data = await res.json();
      if (data.volunteer_warning) {
        alert(`⚠️ Same-Slot Volunteer Notice: ${data.volunteer_warning}`);
      }
      await refreshEventState();
    }

    async function createNewSimEvent() {
      const name = document.getElementById('new-ev-name').value.trim();
      if (!name) return alert('Enter a Sim Event name.');
      const res = await fetch('/api/hyrox/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name,
          event_date: document.getElementById('new-ev-date').value,
          num_days: parseInt(document.getElementById('new-ev-days').value || '2', 10),
          first_wave_time: document.getElementById('new-ev-time').value,
          num_waves: parseInt(document.getElementById('new-ev-waves').value || '6', 10),
          wave_interval_mins: parseInt(document.getElementById('new-ev-interval').value || '20', 10),
          transition_buffer_mins: parseInt(document.getElementById('new-ev-buffer').value || '15', 10),
          lanes_per_wave: 1,
        }),
      });
      if (res.ok) {
        const ev = await res.json();
        currentEventId = ev.id;
        document.getElementById('new-ev-name').value = '';
        await loadEventsList();
      }
    }

    async function addWavesToCurrentEvent() {
      if (!currentEventId) return;
      const dayNumber = parseInt(document.getElementById('blk-day').value || '1', 10);
      const divisionBlock = document.getElementById('blk-division').value || 'women_open';
      const startTime = document.getElementById('blk-start').value || '10:30';
      const count = parseInt(document.getElementById('blk-count').value || '3', 10);
      const gapMins = parseInt(document.getElementById('blk-gap').value || '20', 10);
      const bufferMins = parseInt(document.getElementById('new-ev-buffer').value || '15', 10);
      await fetch(`/api/hyrox/events/${currentEventId}/heats/generate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          day_number: dayNumber,
          division_block: divisionBlock,
          start_time: startTime,
          count: count,
          interval_mins: gapMins,
          transition_buffer_mins: bufferMins,
          max_lanes: 1,
        }),
      });
      await refreshEventState();
    }

    function loadCsvFile(input) {
      const file = input.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        document.getElementById('csv-text-input').value = e.target.result || '';
      };
      reader.readAsText(file);
    }

    async function importTeamUpCsv() {
      if (!currentEventId) return;
      const csvText = document.getElementById('csv-text-input').value.trim();
      if (!csvText) return alert('Upload a CSV file or paste CSV rows first.');
      const res = await fetch(`/api/hyrox/events/${currentEventId}/import-csv`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ csv_text: csvText }),
      });
      const data = await res.json();
      if (res.ok) {
        alert(`✅ Imported ${data.imported_count} athlete/pair entries into the Sim!`);
        document.getElementById('csv-text-input').value = '';
        await loadEventsList();
      } else {
        alert(data.error || 'CSV import failed');
      }
    }

    async function quickAddEntry() {
      if (!currentEventId) return;
      const display_name = document.getElementById('qa-name').value.trim();
      if (!display_name) return alert('Enter an athlete or pair name.');
      const res = await fetch(`/api/hyrox/events/${currentEventId}/entries`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          display_name,
          partner_name: (document.getElementById('qa-partner')?.value || '').trim(),
          email: (document.getElementById('qa-email')?.value || '').trim(),
          division: document.getElementById('qa-division').value,
          age_category: (document.getElementById('qa-age')?.value || '30-34'),
          heat_id: (document.getElementById('qa-heat')?.value || '') || null,
          heat_time: (document.getElementById('qa-time')?.value || '').trim(),
          volunteer_name: (document.getElementById('qa-volunteer')?.value || '').trim(),
        }),
      });
      if (res.ok) {
        document.getElementById('qa-name').value = '';
        if (document.getElementById('qa-partner')) document.getElementById('qa-partner').value = '';
        if (document.getElementById('qa-email')) document.getElementById('qa-email').value = '';
        if (document.getElementById('qa-time')) document.getElementById('qa-time').value = '';
        await loadEventsList();
        document.getElementById('qa-name')?.focus();
      } else {
        const err = await res.json();
        alert(err.error || 'Could not add entry');
      }
    }

    async function quickDeleteEntry(entryId) {
      const res = await fetch(`/api/hyrox/entries/${entryId}`, { method: 'DELETE' });
      if (res.ok) {
        await loadEventsList();
      }
    }

    async function clearAllEntries() {
      if (!currentEventId) return;
      const count = (currentState?.entries || []).length;
      if (!count) return;
      if (!confirm(`Clear all ${count} entries from this event?`)) return;
      const res = await fetch(`/api/hyrox/events/${currentEventId}/clear-entries`, { method: 'POST' });
      if (res.ok) {
        await loadEventsList();
      }
    }

    function onModalPartnerInput(val) {
      const partner = (val || '').trim();
      const divSel = document.getElementById('modal-division');
      if (!divSel || !partner) return;
      const singleToDoubles = {
        women_open: 'women_doubles',
        women_pro: 'women_pro_doubles',
        men_open: 'men_doubles',
        men_pro: 'men_pro_doubles',
      };
      if (singleToDoubles[divSel.value]) {
        divSel.value = singleToDoubles[divSel.value];
      }
    }

    function openSplitsModal(entryId, focusPartner) {
      const entry = (currentState?.entries || []).find(x => x.id === entryId);
      if (!entry) return;
      editingEntry = entry;
      document.getElementById('modal-entry-title').textContent = entry.full_display_name;
      const dayShort = (entry.heat_day_number || 1) === 2 ? 'Sun' : 'Sat';
      document.getElementById('modal-entry-subtitle').textContent =
        `${entry.division_label} · ${entry.heat_start_time ? dayShort + ' ' + entry.heat_start_time : 'Unassigned'}`;

      const divSel = document.getElementById('modal-division');
      if (divSel) {
        divSel.innerHTML = ADMIN_DIVISIONS.map(d =>
          `<option value="${d.key}" ${(entry.division || 'men_open') === d.key ? 'selected' : ''}>${d.label} (${d.short})</option>`
        ).join('');
        divSel.value = entry.division || 'men_open';
      }
      document.getElementById('modal-display-name').value = entry.display_name || '';
      document.getElementById('modal-partner-name').value = entry.partner_name || '';
      const modalAgeEl = document.getElementById('modal-age-category');
      if (modalAgeEl) modalAgeEl.value = entry.age_category || '30-34';
      document.getElementById('modal-volunteer').value = entry.volunteer_name || '';
      document.getElementById('modal-bib').value = entry.bib_number || '';
      document.getElementById('modal-email').value = entry.email || '';
      document.getElementById('modal-notes').value = entry.notes || '';
      document.getElementById('modal-custom-day').value = String(entry.heat_day_number || 1);
      document.getElementById('modal-custom-time').value = '';

      const heats = currentState?.heats || [];
      const heatSel = document.getElementById('modal-heat-id');
      heatSel.innerHTML = `<option value="">Unassigned</option>` + heats.map(h => {
        const dShort = (h.day_number || 1) === 2 ? 'Sun' : 'Sat';
        return `<option value="${h.id}" ${entry.heat_id === h.id ? 'selected' : ''}>${dShort} ${h.start_time}</option>`;
      }).join('');

      document.getElementById('modal-status').value = entry.status;
      document.getElementById('modal-penalty').value = entry.penalty_formatted || '00:00';
      document.getElementById('modal-wb-reps').value = entry.wall_ball_reps || 0;

      const combSel = document.getElementById('comb-first-idx');
      combSel.innerHTML = entry.splits.slice(0, 15).map((s, idx) =>
        `<option value="${s.split_index}">#${s.split_index} ${cleanSplitLabel(s.short_label || s.label)} + #${s.split_index + 1} ${cleanSplitLabel(entry.splits[idx + 1].short_label || entry.splits[idx + 1].label)}</option>`
      ).join('');

      const grid = document.getElementById('modal-splits-grid');
      grid.innerHTML = entry.splits.map(s => `
        <div class="split-edit-item">
          <div style="font-weight:800;font-size:0.82rem">${cleanSplitLabel(s.label)}</div>
          <input type="text" class="split-dur-input" data-split-index="${s.split_index}"
            value="${s.duration_ms !== null ? s.duration_formatted : ''}"
            placeholder="MM:SS" style="width:92px;text-align:center;font-weight:800" />
        </div>
      `).join('');

      document.getElementById('splits-modal').classList.add('open');
      if (focusPartner) {
        setTimeout(() => {
          const pInput = document.getElementById('modal-partner-name');
          if (pInput) pInput.focus();
        }, 60);
      }
    }

    function closeSplitsModal() {
      document.getElementById('splits-modal').classList.remove('open');
      editingEntry = null;
    }

    function collectModalEntryMetaPayload() {
      const payload = {
        display_name: document.getElementById('modal-display-name').value.trim(),
        partner_name: document.getElementById('modal-partner-name').value.trim(),
        division: document.getElementById('modal-division').value,
        age_category: (document.getElementById('modal-age-category')?.value || editingEntry?.age_category || '30-34'),
        heat_id: document.getElementById('modal-heat-id').value || null,
        volunteer_name: document.getElementById('modal-volunteer').value.trim(),
        bib_number: document.getElementById('modal-bib').value.trim(),
        email: document.getElementById('modal-email').value.trim(),
        status: document.getElementById('modal-status').value,
        penalty_str: document.getElementById('modal-penalty').value.trim(),
        wall_ball_reps: parseInt(document.getElementById('modal-wb-reps').value || '0', 10),
        notes: document.getElementById('modal-notes').value.trim(),
      };
      const customTime = document.getElementById('modal-custom-time').value.trim();
      if (customTime) {
        payload.custom_slot_time = customTime;
        payload.custom_slot_day = parseInt(document.getElementById('modal-custom-day').value || '1', 10);
      }
      return payload;
    }

    async function saveEntryDetailsOnly() {
      if (!editingEntry) return;
      const metaPayload = collectModalEntryMetaPayload();
      const res = await fetch(`/api/hyrox/entries/${editingEntry.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(metaPayload),
      });
      const data = await res.json();
      if (res.ok) {
        if (data.volunteer_warning) {
          alert(`⚠️ Same-Slot Volunteer Notice: ${data.volunteer_warning}`);
        }
        closeSplitsModal();
        await refreshEventState();
      } else {
        alert(data.error || 'Failed to update athlete details');
      }
    }

    async function deleteCurrentEntry() {
      if (!editingEntry) return;
      if (!confirm(`Delete #${editingEntry.bib_number} ${editingEntry.full_display_name} from this Sim?`)) return;
      const res = await fetch(`/api/hyrox/entries/${editingEntry.id}`, { method: 'DELETE' });
      if (res.ok) {
        closeSplitsModal();
        await loadEventsList();
      }
    }

    async function saveSplitCorrections() {
      if (!editingEntry) return;
      const metaPayload = collectModalEntryMetaPayload();
      await fetch(`/api/hyrox/entries/${editingEntry.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(metaPayload),
      });

      const splitsPayload = [];
      document.querySelectorAll('.split-dur-input').forEach(inp => {
        splitsPayload.push({
          split_index: parseInt(inp.dataset.splitIndex, 10),
          duration_str: inp.value.trim(),
        });
      });

      const res = await fetch(`/api/hyrox/entries/${editingEntry.id}/splits`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          splits: splitsPayload,
          status: document.getElementById('modal-status').value,
          penalty_str: document.getElementById('modal-penalty').value.trim(),
          wall_ball_reps: parseInt(document.getElementById('modal-wb-reps').value || '0', 10),
          edited_by: 'race_director',
        }),
      });
      if (res.ok) {
        closeSplitsModal();
        await refreshEventState();
      }
    }

    async function applyCombinedSplit() {
      if (!editingEntry) return;
      const firstIdx = parseInt(document.getElementById('comb-first-idx').value, 10);
      const combStr = document.getElementById('comb-total-str').value.trim();
      const firstStr = document.getElementById('comb-first-str').value.trim();
      if (!combStr || !firstStr) return alert('Enter both Combined Total Time and First Split Time (MM:SS).');

      const res = await fetch(`/api/hyrox/entries/${editingEntry.id}/splits`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          split_combined: {
            first_split_index: firstIdx,
            combined_duration_str: combStr,
            first_duration_str: firstStr,
          },
          edited_by: 'race_director_split',
        }),
      });
      if (res.ok) {
        await refreshEventState();
        openSplitsModal(editingEntry.id);
      } else {
        const err = await res.json();
        alert(err.error || 'Could not split combined segment');
      }
    }

    async function resetEntryTimer() {
      if (!editingEntry) return;
      if (!confirm(`Reset all 16 splits for ${editingEntry.full_display_name} back to scheduled?`)) return;
      await fetch(`/api/hyrox/entries/${editingEntry.id}/reset`, { method: 'POST' });
      closeSplitsModal();
      await refreshEventState();
    }

    async function loadTeamUpStatus() {
      try {
        const res = await fetch('/api/hyrox/teamup/status');
        if (!res.ok) return;
        const st = await res.json();
        const badge = document.getElementById('teamup-api-badge');
        const tokInput = document.getElementById('tu-api-token');
        const provInput = document.getElementById('tu-provider-id');
        if (st.provider_id && provInput) provInput.value = st.provider_id;
        if (st.has_token && tokInput && !tokInput.value) tokInput.placeholder = `Saved (${st.masked_token})`;
        if (badge) {
          badge.textContent = st.configured ? `API v2: Token Configured` : `API v2: Ready`;
          badge.style.background = st.configured ? 'rgba(61, 255, 79, 0.16)' : 'rgba(255, 255, 255, 0.08)';
          badge.style.color = st.configured ? 'var(--green)' : 'var(--muted)';
        }
      } catch (e) {}
    }

    async function saveAndTestTeamUpApi() {
      const api_token = document.getElementById('tu-api-token').value.trim();
      const provider_id = document.getElementById('tu-provider-id').value.trim();
      const msgEl = document.getElementById('tu-status-msg');
      msgEl.textContent = 'Saving & verifying with goteamup.com/api/v2/auth/application...';
      await fetch('/api/hyrox/teamup/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ api_token, provider_id }),
      });
      const testRes = await fetch('/api/hyrox/teamup/test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ api_token, provider_id }),
      });
      const data = await testRes.json();
      await loadTeamUpStatus();
      if (testRes.ok && data.ok) {
        if (data.provider_id) document.getElementById('tu-provider-id').value = data.provider_id;
        msgEl.innerHTML = `<span style="color:var(--green);font-weight:700">✅ Connected to TeamUp v2 (Provider #${data.provider_id || 'OK'})</span>`;
      } else {
        msgEl.innerHTML = `<span style="color:var(--yellow)">Saved config · Live verify: ${data.error || 'Token not verified yet'}</span>`;
      }
    }

    async function loadRemoteTeamUpEvents() {
      const msgEl = document.getElementById('tu-status-msg');
      const sel = document.getElementById('tu-event-select');
      const api_token = ((document.getElementById('tu-api-token') || {}).value || '').trim();
      const provider_id = ((document.getElementById('tu-provider-id') || {}).value || '').trim();
      if (api_token && !api_token.includes('••••')) {
        await fetch('/api/hyrox/teamup/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ api_token, provider_id }),
        });
      }
      const dFrom = (currentState && currentState.event && currentState.event.event_date) || '2026-11-14';
      const dTo = (currentState && currentState.event && currentState.event.end_date) || dFrom;
      msgEl.textContent = `Fetching TeamUp classes (${dFrom} → ${dTo})...`;
      const res = await fetch(`/api/hyrox/teamup/events?date_from=${encodeURIComponent(dFrom)}&date_to=${encodeURIComponent(dTo)}`);
      const data = await res.json();
      if (res.ok && data.ok) {
        const events = data.events || [];
        sel.innerHTML = `<option value="">All TeamUp Classes on Sim Dates (${events.length} classes)</option>` +
          events.map(ev => {
            const dt = (ev.starts_at || '').replace('T', ' ').slice(0, 16);
            const occ = ev.attending_count !== undefined ? ev.attending_count : (ev.occupancy || 0);
            return `<option value="${ev.id}">${dt} — ${escapeHtml(ev.name)} (${occ}/${ev.max_occupancy || '?'} signed up)</option>`;
          }).join('');
        msgEl.innerHTML = `<span style="color:var(--green);font-weight:700">✅ Loaded ${events.length} TeamUp classes for ${dFrom} → ${dTo}</span>`;
      } else {
        msgEl.innerHTML = `<span style="color:var(--red)">${data.error || 'Could not load TeamUp events'}</span>`;
      }
    }

    async function syncFromTeamUpApi() {
      if (!currentEventId) return;
      const msgEl = document.getElementById('tu-status-msg');
      const selectedTuEventId = (document.getElementById('tu-event-select') || {}).value || '';
      const autoStagger = !!(document.getElementById('tu-auto-stagger') || {}).checked;
      const api_token = ((document.getElementById('tu-api-token') || {}).value || '').trim();
      const provider_id = ((document.getElementById('tu-provider-id') || {}).value || '').trim();
      msgEl.textContent = 'Pulling /api/v2/attendances?expand=event,customer...';
      const payload = { auto_stagger_slots: autoStagger };
      if (selectedTuEventId) payload.teamup_event_ids = [selectedTuEventId];
      if (api_token && !api_token.includes('••••')) payload.api_token = api_token;
      if (provider_id) payload.provider_id = provider_id;
      const res = await fetch(`/api/hyrox/events/${currentEventId}/sync-teamup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        msgEl.innerHTML = `<span style="color:var(--green);font-weight:700">✅ Synced ${data.synced_count} entries (${data.cancelled_count} cancelled)</span>`;
        await loadTeamUpStatus();
        await loadEventsList();
      } else {
        msgEl.innerHTML = `<span style="color:var(--red)">${data.error || 'Sync failed'}</span>`;
      }
    }

    initWeekendSetupDates();
    loadEventsList();
    loadTeamUpStatus();
  </script>
</body>
</html>
