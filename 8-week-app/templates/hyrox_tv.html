<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS Performance HYROX — Live Gym TV Broadcast</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #030604;
      --surface: #0a120c;
      --surface-2: #111e15;
      --border: rgba(61, 255, 79, 0.28);
      --green: #3DFF4F;
      --yellow: #facc15;
      --blue: #38bdf8;
      --red: #f43f5e;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top left, #0e2214 0%, var(--bg) 65%);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .tv-header {
      position: relative;
      background: rgba(8, 14, 10, 0.96);
      border-bottom: 2px solid var(--green);
      padding: 0.6rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .tv-roll-progress {
      position: absolute;
      left: 0;
      bottom: -2px;
      height: 2px;
      background: linear-gradient(90deg, var(--green), var(--blue));
      width: 0%;
      transition: width 0.4s linear;
    }
    .tv-brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }
    .tv-logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: contain;
      border: 1px solid var(--border);
    }
    .tv-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-style: italic;
      font-weight: 800;
      font-size: 1.95rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      line-height: 1;
    }
    .tv-title span { color: var(--green); }
    .tv-event-name {
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 0.1rem;
    }
    .tv-clock {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 2.05rem;
      color: var(--green);
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }

    .tv-grid {
      display: grid;
      grid-template-columns: 1.48fr 1fr;
      gap: 1rem;
      padding: 0.85rem 1.4rem;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    @media (max-width: 1024px) {
      body { height: auto; max-height: none; overflow-y: auto; }
      .tv-grid { grid-template-columns: 1fr; overflow: visible; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0.9rem 1.05rem;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.55rem;
      margin-bottom: 0.65rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
      gap: 0.6rem;
    }
    .panel-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-style: italic;
      font-weight: 800;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      line-height: 1;
    }
    .page-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(61, 255, 79, 0.12);
      border: 1px solid rgba(61, 255, 79, 0.35);
      color: var(--green);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    @keyframes tvFadeSlide {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .roll-stage {
      animation: tvFadeSlide 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #live-racers-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      justify-content: flex-start;
      overflow: hidden;
    }

    /* Live Floor Athlete Broadcast Card (Fits 2 Stacked Cards in 100vh) */
    .racer-card {
      background: linear-gradient(180deg, #132318 0%, #0b140e 100%);
      border: 1.5px solid rgba(61, 255, 79, 0.38);
      border-radius: 14px;
      padding: 0.78rem 0.95rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
      flex: 1;
      min-height: 0;
      max-height: 49%;
    }
    .racer-card.single-spotlight {
      max-height: 100%;
      padding: 1.05rem 1.2rem;
    }
    .racer-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.4rem;
    }
    .racer-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-style: italic;
      font-weight: 800;
      font-size: 1.85rem;
      text-transform: uppercase;
      line-height: 1.02;
      color: #fff;
    }
    .racer-card.single-spotlight .racer-name {
      font-size: 2.35rem;
    }
    .racer-clocks-wrap {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-shrink: 0;
    }
    .stage-clock-box {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 10px;
      padding: 0.22rem 0.6rem;
      text-align: right;
    }
    .stage-clock-lbl {
      font-size: 0.58rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--blue);
    }
    .stage-clock-val {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 1.45rem;
      color: #e0f2fe;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .racer-clock-box {
      background: rgba(61, 255, 79, 0.12);
      border: 1.5px solid rgba(61, 255, 79, 0.45);
      border-radius: 10px;
      padding: 0.22rem 0.7rem;
      text-align: right;
    }
    .racer-clock-lbl {
      font-size: 0.58rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--green);
    }
    .racer-clock {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 2.05rem;
      color: var(--green);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .racer-card.single-spotlight .racer-clock {
      font-size: 2.6rem;
    }

    /* Middle Telemetry & Current Stage Bar */
    .racer-telemetry-bar {
      display: grid;
      grid-template-columns: 1.55fr repeat(4, 1fr);
      gap: 0.45rem;
      align-items: stretch;
      margin-bottom: 0.48rem;
    }
    .station-callout {
      background: rgba(250, 204, 21, 0.14);
      border: 1px solid rgba(250, 204, 21, 0.48);
      color: var(--yellow);
      padding: 0.32rem 0.65rem;
      border-radius: 9px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .station-callout.finished {
      background: rgba(61, 255, 79, 0.14);
      border-color: rgba(61, 255, 79, 0.48);
      color: var(--green);
    }
    .station-callout-kicker {
      font-size: 0.58rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.88;
    }
    .station-callout-main {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
    }
    .stat-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9px;
      padding: 0.28rem 0.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .stat-pill-lbl {
      font-size: 0.56rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .stat-pill-val {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      color: #f8fafc;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
    }
    .stat-pill-sub {
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--blue);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Compact 2x8 Horizontal Split Matrix (Fits all 16 splits in ~82px height) */
    .tv-roxfit-board {
      background: #060b08;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 11px;
      padding: 0.45rem 0.55rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .split-strip-row {
      display: grid;
      grid-template-columns: 62px repeat(8, 1fr);
      gap: 0.32rem;
      align-items: stretch;
    }
    .strip-row-tag {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0.2rem 0.35rem;
      border-radius: 6px;
      font-size: 0.62rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      line-height: 1.1;
    }
    .strip-row-tag.runs {
      background: rgba(99, 102, 241, 0.18);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.35);
    }
    .strip-row-tag.stations {
      background: rgba(168, 85, 247, 0.18);
      color: #d8b4fe;
      border: 1px solid rgba(168, 85, 247, 0.35);
    }
    .split-cell {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 7px;
      padding: 0.22rem 0.32rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      position: relative;
      overflow: hidden;
    }
    .racer-card.single-spotlight .split-cell {
      padding: 0.45rem 0.5rem;
    }
    .split-cell.done-run {
      background: linear-gradient(180deg, rgba(79, 70, 229, 0.38) 0%, rgba(49, 46, 129, 0.52) 100%);
      border-color: rgba(129, 140, 248, 0.48);
    }
    .split-cell.done-station {
      background: linear-gradient(180deg, rgba(147, 51, 234, 0.38) 0%, rgba(88, 28, 135, 0.52) 100%);
      border-color: rgba(192, 132, 252, 0.48);
    }
    .split-cell.active-stage {
      background: rgba(61, 255, 79, 0.18);
      border: 1.5px solid var(--green);
      box-shadow: 0 0 12px rgba(61, 255, 79, 0.32);
    }
    .split-cell-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.15rem;
      font-size: 0.62rem;
      font-weight: 800;
      color: #cbd5e1;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .split-cell.active-stage .split-cell-top {
      color: var(--green);
    }
    .split-cell-time {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      color: #fff;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      margin-top: 0.08rem;
    }
    .racer-card.single-spotlight .split-cell-time {
      font-size: 1.35rem;
    }
    .split-cell.upcoming .split-cell-time {
      color: rgba(148, 163, 184, 0.45);
    }
    .split-cell-sub {
      font-size: 0.55rem;
      font-weight: 700;
      color: #93c5fd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tv-pb-pill {
      background: var(--yellow);
      color: #09090b;
      font-size: 0.52rem;
      font-weight: 900;
      padding: 0.04rem 0.26rem;
      border-radius: 3px;
      text-transform: uppercase;
      line-height: 1;
    }
    .tv-select, .tv-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 0.35rem 0.6rem;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .tv-btn.paused {
      border-color: var(--yellow);
      color: var(--yellow);
      background: rgba(250, 204, 21, 0.12);
    }

    /* Right Column: Rotating Leaderboard & Rolling Next Slots */
    .right-col-stack {
      display: grid;
      grid-template-rows: 1.25fr 1fr;
      gap: 0.85rem;
      min-height: 0;
      overflow: hidden;
    }
    #leaderboard-rows {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.42rem;
      overflow: hidden;
    }
    .lb-row {
      display: grid;
      grid-template-columns: 36px 1fr auto auto;
      gap: 0.6rem;
      align-items: center;
      padding: 0.5rem 0.7rem;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .lb-rank {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 1.35rem;
      color: var(--green);
      text-align: center;
      line-height: 1;
    }
    .lb-time {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 1.45rem;
      color: #fff;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    #ondeck-rows {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.42rem;
      overflow: hidden;
    }
    .ondeck-item {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.16rem;
      padding: 0.48rem 0.68rem;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid rgba(56, 189, 248, 0.2);
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <header class="tv-header">
    <div class="tv-brand">
      <img src="/static/logo.jpg" alt="CS Performance Gym" class="tv-logo" />
      <div>
        <div class="tv-title">CS PERFORMANCE <span>HYROX</span> · TRAIN HARD &amp; BE SOUND</div>
        <div class="tv-event-name" id="tv-event-subtitle">Loading Active HYROX Sim...</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:0.65rem">
      <a href="/hyrox/admin" class="tv-btn" style="text-decoration:none" title="Open Race Director Console">⚙️ Console</a>
      <a href="/" class="tv-btn" style="text-decoration:none" title="Back to CS Performance Hub">🏠 Hub</a>
      <button type="button" id="tv-pause-btn" class="tv-btn" onclick="toggleRollPause()">⏸ Pause Roll</button>
      <select id="tv-spotlight-select" class="tv-select" onchange="setSpotlightEntry(this.value)">
        <option value="auto">📺 Auto-Roll Floor Grid (2 per screen)</option>
        <option value="auto-single">🎯 Auto-Roll 1-by-1 Spotlight</option>
      </select>
      <div class="tv-clock" id="wall-clock">--:--:--</div>
    </div>
    <div class="tv-roll-progress" id="tv-roll-progress"></div>
  </header>

  <main class="tv-grid">
    <!-- LEFT: MULTI-RACER TV BROADCAST CARDS (2 PER SCREEN, AUTO-ROLLING) -->
    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">🔥 LIVE ON-FLOOR TELEMETRY &amp; 16-STAGE MATRIX (HYROX APP VIEW)</div>
        <div style="display:flex;align-items:center;gap:0.5rem">
          <span class="page-pill" id="racer-page-badge">PAGE 1 / 1</span>
          <span style="font-size:0.78rem;font-weight:800;color:var(--green)" id="active-count-badge">1 ON FLOOR</span>
        </div>
      </div>
      <div id="live-racers-container"></div>
    </section>

    <!-- RIGHT: AUTO-ROLLING 9-DIVISION FINISHER BOARD + ROLLING NEXT SLOTS ON DECK -->
    <div class="right-col-stack">
      <section class="panel">
        <div class="panel-header">
          <div class="panel-title" id="lb-division-title">🤝 FINISHER BOARD · TRAIN HARD &amp; BE SOUND</div>
          <div style="display:flex;align-items:center;gap:0.45rem">
            <span class="page-pill" id="lb-page-badge">1 / 1</span>
            <div id="lb-dots" style="display:flex;gap:0.3rem"></div>
          </div>
        </div>
        <div id="leaderboard-rows"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div class="panel-title" style="color:var(--blue);font-size:1.35rem">⏳ NEXT 1:1 SLOTS ON DECK &amp; WEIGHT SETUP</div>
          <span class="page-pill" id="ondeck-page-badge" style="color:var(--blue);border-color:rgba(56,189,248,0.35);background:rgba(56,189,248,0.12)">NEXT UP</span>
        </div>
        <div id="ondeck-rows"></div>
      </section>
    </div>
  </main>

  <script>
    const activeEventId = {{ active_event_id or 'null' }};
    let tvState = null;
    let rotationIndex = 0;
    let racerPageIndex = 0;
    let onDeckPageIndex = 0;
    let rollPaused = false;
    let rollTickSec = 0;
    const ROLL_INTERVAL_SEC = 7;
    let spotlightEntryId = 'auto';
    const divisionOrder = [
      'women_open',
      'women_doubles',
      'women_pro',
      'women_pro_doubles',
      'men_open',
      'men_doubles',
      'mixed_doubles',
      'men_pro',
      'men_pro_doubles'
    ];
    const SHORT_STATION_NAMES = {
      2: '1. SKI',
      4: '2. PUSH',
      6: '3. PULL',
      8: '4. BBJ',
      10: '5. ROW',
      12: '6. FARM',
      14: '7. LUNG',
      16: '8. WB'
    };

    function toggleRollPause() {
      rollPaused = !rollPaused;
      const btn = document.getElementById('tv-pause-btn');
      if (btn) {
        btn.textContent = rollPaused ? '▶ Resume Roll' : '⏸ Pause Roll';
        btn.classList.toggle('paused', rollPaused);
      }
    }

    function setSpotlightEntry(val) {
      spotlightEntryId = val;
      racerPageIndex = 0;
      renderLiveRacers(true);
    }

    function formatElapsed(ms) {
      if (!ms || ms < 0) ms = 0;
      const s = Math.floor(ms / 1000);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
      return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    async function fetchTvState() {
      let evId = activeEventId;
      if (!evId) {
        const r = await fetch('/api/hyrox/events');
        const list = await r.json();
        if (list.length) evId = list[0].id;
      }
      if (!evId) return;
      const res = await fetch(`/api/hyrox/events/${evId}/state`);
      if (!res.ok) return;
      tvState = await res.json();
      document.getElementById('tv-event-subtitle').textContent =
        `${tvState.event.name} · ${tvState.event.venue} · Single-Screen Rolling Broadcast · 1.2 km Run Loop`;
      populateSpotlightSelect();
      renderLiveRacers(false);
      renderRotatingLeaderboard(false);
      renderOnDeck(false);
    }

    function populateSpotlightSelect() {
      if (!tvState) return;
      const sel = document.getElementById('tv-spotlight-select');
      const prev = spotlightEntryId;
      const allEntries = tvState.entries || [];
      sel.innerHTML =
        `<option value="auto" ${prev === 'auto' ? 'selected' : ''}>📺 Auto-Roll Floor Grid (2 per screen)</option>` +
        `<option value="auto-single" ${prev === 'auto-single' ? 'selected' : ''}>🎯 Auto-Roll 1-by-1 Spotlight</option>` +
        allEntries.map(e => `<option value="${e.id}" ${String(prev) === String(e.id) ? 'selected' : ''}>📌 Pin #${e.bib_number} ${e.full_display_name} (${e.division_short_label} · ${e.status.toUpperCase()})</option>`).join('');
    }

    function renderLiveRacers(animateTransition) {
      if (!tvState) return;
      const racers = tvState.racing_entries || [];
      const finished = tvState.finished_entries || [];
      const allEntries = tvState.entries || [];
      document.getElementById('active-count-badge').textContent =
        racers.length > 0 ? `${racers.length} RACING NOW` : `${finished.length} FINISHED`;
      const container = document.getElementById('live-racers-container');
      const pageBadge = document.getElementById('racer-page-badge');

      let pool = [];
      let pageSize = 2;

      if (spotlightEntryId !== 'auto' && spotlightEntryId !== 'auto-single') {
        const picked = allEntries.find(x => String(x.id) === String(spotlightEntryId));
        if (picked) pool = [picked];
        pageSize = 1;
      } else {
        pool = racers.length > 0 ? racers : finished;
        pageSize = (spotlightEntryId === 'auto-single' || pool.length === 1) ? 1 : 2;
      }

      if (!pool.length) {
        if (pageBadge) pageBadge.textContent = 'STANDBY';
        container.innerHTML = `<div style="padding:2rem;text-align:center;color:var(--muted);margin:auto">No athletes currently on the floor. Waiting for next 1:1 slot start...</div>`;
        return;
      }

      const totalPages = Math.max(1, Math.ceil(pool.length / pageSize));
      const safePage = racerPageIndex % totalPages;
      const targetEntries = pool.slice(safePage * pageSize, safePage * pageSize + pageSize);
      const isSingleCard = targetEntries.length === 1;

      if (pageBadge) {
        const modePrefix = racers.length > 0 ? 'LIVE FLOOR' : 'RECENT FINISHERS';
        pageBadge.textContent = totalPages > 1
          ? `${modePrefix} · PAGE ${safePage + 1} / ${totalPages}`
          : `${modePrefix} (${pool.length})`;
      }

      if (animateTransition) {
        container.classList.remove('roll-stage');
        void container.offsetWidth;
        container.classList.add('roll-stage');
      }

      container.innerHTML = targetEntries.map(e => {
        const splits = e.splits || [];
        const completedSplits = splits.filter(s => s.duration_ms !== null && s.duration_ms !== undefined);
        const completedRuns = completedSplits.filter(s => s.split_type === 'run').length;
        const completedStns = completedSplits.filter(s => s.split_type === 'station').length;
        const completedSumMs = splits.reduce((acc, s) => acc + (s.duration_ms || 0), 0);
        const lastDone = completedSplits.length ? completedSplits[completedSplits.length - 1] : null;
        const cur = e.current_split_info || {};
        const isFinished = e.status === 'finished';

        const runSplits = splits.filter(s => s.split_type === 'run');
        const stnSplits = splits.filter(s => s.split_type === 'station');

        const renderCell = (s, idx) => {
          const isDone = s.duration_ms !== null && s.duration_ms !== undefined;
          const isCurrent = e.status === 'racing' && s.split_index === e.current_split_index;
          const shortTitle = s.split_type === 'run'
            ? `RUN ${idx + 1}`
            : (SHORT_STATION_NAMES[s.split_index] || s.roxfit_label || s.label);
          const cellCls = isCurrent
            ? 'active-stage'
            : (isDone ? (s.split_type === 'run' ? 'done-run' : 'done-station') : 'upcoming');

          let badgeHtml = '';
          if (s.is_pb) {
            badgeHtml = `<span class="tv-pb-pill">PB</span>`;
          } else if (isDone && s.split_rank) {
            badgeHtml = `<span style="font-size:0.55rem;color:#e2e8f0;font-weight:800">#${s.split_rank}</span>`;
          } else if (isCurrent) {
            badgeHtml = `<span style="font-size:0.55rem;color:var(--green);font-weight:900">● NOW</span>`;
          }

          let timeHtml = isDone ? s.duration_formatted : '—';
          if (isCurrent) {
            timeHtml = `<span class="live-split-clock" data-started-ms="${e.started_at_ms || 0}" data-completed-sum-ms="${completedSumMs}" style="color:var(--green)">00:00</span>`;
          }

          let subHtml = '';
          if (s.split_type === 'run') {
            subHtml = (isDone && s.pace_kph_formatted && s.pace_kph_formatted !== '—')
              ? s.pace_kph_formatted
              : '1.2 km';
          } else {
            subHtml = s.prescription ? s.prescription.split('·')[0].trim() : 'Station';
          }

          return `
            <div class="split-cell ${cellCls}">
              <div class="split-cell-top">
                <span>${shortTitle}</span>
                ${badgeHtml}
              </div>
              <div class="split-cell-time">${timeHtml}</div>
              <div class="split-cell-sub">${subHtml}</div>
            </div>
          `;
        };

        const runCellsHtml = runSplits.map((s, idx) => renderCell(s, idx)).join('');
        const stnCellsHtml = stnSplits.map((s, idx) => renderCell(s, idx)).join('');

        return `
          <div class="racer-card ${isSingleCard ? 'single-spotlight' : ''}">
            <div class="racer-top">
              <div style="min-width:0">
                <div style="font-size:0.74rem;font-weight:800;color:${e.division_color};text-transform:uppercase;letter-spacing:0.04em">
                  DAY ${e.heat_day_number || 1} · BIB #${e.bib_number} · ${e.division_label} · VOL: ${e.volunteer_name || 'Assigned'}
                </div>
                <div class="racer-name">${e.full_display_name}</div>
              </div>
              <div class="racer-clocks-wrap">
                ${!isFinished ? `
                  <div class="stage-clock-box">
                    <div class="stage-clock-lbl">Stage ${e.completed_splits + 1}/16 Split</div>
                    <div class="stage-clock-val live-split-clock" data-started-ms="${e.started_at_ms || 0}" data-completed-sum-ms="${completedSumMs}">00:00</div>
                  </div>
                ` : ''}
                <div class="racer-clock-box">
                  <div class="racer-clock-lbl">${isFinished ? 'Official Finish' : 'Total Elapsed'}</div>
                  <div class="racer-clock" data-started-ms="${isFinished ? 0 : (e.started_at_ms || 0)}">${isFinished ? e.total_formatted : '00:00'}</div>
                </div>
              </div>
            </div>

            <div class="racer-telemetry-bar">
              <div class="station-callout ${isFinished ? 'finished' : ''}">
                <div class="station-callout-kicker">
                  ${isFinished ? '🏁 RACE COMPLETE (16/16 SPLITS)' : `⚡ ACTIVE STAGE ${e.completed_splits + 1} OF 16`}
                  ${e.wall_ball_reps > 0 ? ` · 🎯 WB ${e.wall_ball_reps}/${e.wall_ball_target_reps}` : ''}
                </div>
                <div class="station-callout-main">
                  ${isFinished ? `Finished in ${e.total_formatted}` : `${cur.label || 'On Floor'} — ${cur.prescription || ''}`}
                </div>
              </div>

              <div class="stat-pill">
                <div class="stat-pill-lbl">Avg Run (1.2km)</div>
                <div class="stat-pill-val">${e.avg_run_formatted || '--:--'}</div>
                <div class="stat-pill-sub">${e.avg_run_kph_formatted || '1.2 km loop'}${e.avg_run_rank ? ` · Rank #${e.avg_run_rank}` : ''}</div>
              </div>

              <div class="stat-pill">
                <div class="stat-pill-lbl">Run Total</div>
                <div class="stat-pill-val">${e.run_total_formatted || '00:00'}</div>
                <div class="stat-pill-sub">${completedRuns} / 8 runs done</div>
              </div>

              <div class="stat-pill">
                <div class="stat-pill-lbl">Station Total</div>
                <div class="stat-pill-val">${e.station_total_formatted || '00:00'}</div>
                <div class="stat-pill-sub">${completedStns} / 8 stations done</div>
              </div>

              <div class="stat-pill">
                <div class="stat-pill-lbl">Last Completed</div>
                <div class="stat-pill-val">${lastDone ? lastDone.duration_formatted : '--:--'}</div>
                <div class="stat-pill-sub">${lastDone ? `${lastDone.roxfit_label || lastDone.label}${lastDone.split_rank ? ' (#' + lastDone.split_rank + ')' : ''}` : 'Awaiting Split 1'}</div>
              </div>
            </div>

            <div class="tv-roxfit-board">
              <div class="split-strip-row">
                <div class="strip-row-tag runs">RUNS<br/><span style="font-size:0.52rem;opacity:0.8">8 × 1.2km</span></div>
                ${runCellsHtml}
              </div>
              <div class="split-strip-row">
                <div class="strip-row-tag stations">WORKOUT<br/><span style="font-size:0.52rem;opacity:0.8">8 Stations</span></div>
                ${stnCellsHtml}
              </div>
            </div>
          </div>
        `;
      }).join('');
      tickLiveClocks();
    }

    function renderRotatingLeaderboard(animateTransition) {
      if (!tvState || !tvState.leaderboards) return;
      const nonEmptyDivs = divisionOrder.filter(k => (tvState.leaderboards[k]?.entries || []).length > 0);
      const activeList = nonEmptyDivs.length ? nonEmptyDivs : divisionOrder;

      // Build paginated slides (max 4 entries per TV slide so it never overflows)
      const LB_PAGE_SIZE = 4;
      const slides = [];
      activeList.forEach(divKey => {
        const board = tvState.leaderboards[divKey];
        if (!board) return;
        const entries = board.entries || [];
        if (entries.length === 0) {
          slides.push({ divKey, board, slice: [], startRank: 1, pageNum: 1, totalPages: 1 });
        } else {
          const pages = Math.ceil(entries.length / LB_PAGE_SIZE);
          for (let p = 0; p < pages; p++) {
            slides.push({
              divKey,
              board,
              slice: entries.slice(p * LB_PAGE_SIZE, (p + 1) * LB_PAGE_SIZE),
              startRank: p * LB_PAGE_SIZE + 1,
              pageNum: p + 1,
              totalPages: pages
            });
          }
        }
      });

      if (!slides.length) return;
      const currentSlide = slides[rotationIndex % slides.length];
      const { board, slice, startRank, pageNum, totalPages } = currentSlide;

      document.getElementById('lb-division-title').innerHTML =
        `🤝 <span style="color:${board.color}">${board.label}</span> FINISHERS · TRAIN HARD &amp; BE SOUND`;

      const lbBadge = document.getElementById('lb-page-badge');
      if (lbBadge) {
        lbBadge.textContent = totalPages > 1
          ? `PAGE ${pageNum}/${totalPages} · SLIDE ${(rotationIndex % slides.length) + 1}/${slides.length}`
          : `DIV ${(rotationIndex % slides.length) + 1} / ${slides.length}`;
      }

      const dotsEl = document.getElementById('lb-dots');
      if (dotsEl) {
        dotsEl.innerHTML = slides.map((s, idx) => {
          const active = idx === (rotationIndex % slides.length);
          return `<span style="width:${active ? '16px' : '7px'};height:7px;border-radius:999px;background:${active ? s.board.color : 'rgba(255,255,255,0.18)'};transition:all 0.25s ease"></span>`;
        }).join('');
      }

      const rowsEl = document.getElementById('leaderboard-rows');
      if (animateTransition) {
        rowsEl.classList.remove('roll-stage');
        void rowsEl.offsetWidth;
        rowsEl.classList.add('roll-stage');
      }

      if (!slice.length) {
        rowsEl.innerHTML = `<div style="padding:1.25rem;color:var(--muted);text-align:center;margin:auto">No finished athletes in ${board.label} yet — Train Hard &amp; Be Sound!</div>`;
        return;
      }

      rowsEl.innerHTML = slice.map((e) => `
        <div class="lb-row" style="cursor:pointer" onclick="setSpotlightEntry('${e.id}')">
          <div class="lb-rank">🏁</div>
          <div style="min-width:0">
            <div style="font-weight:800;font-size:0.96rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.full_display_name}</div>
            <div style="font-size:0.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Bib #${e.bib_number} · Run ${e.run_total_formatted} (${e.avg_run_kph_formatted}) · Stn ${e.station_total_formatted}</div>
          </div>
          <div style="text-align:right">
            ${e.history && e.history.comparison && e.history.comparison.total_delta_ms < 0
              ? `<span style="font-size:0.68rem;background:rgba(61,255,79,0.16);color:var(--green);padding:0.18rem 0.42rem;border-radius:6px;font-weight:800">PB ${e.history.comparison.total_delta_formatted}</span>`
              : ''}
          </div>
          <div class="lb-time">${e.total_formatted}</div>
        </div>
      `).join('');
    }

    function renderOnDeck(animateTransition) {
      if (!tvState) return;
      const sched = tvState.scheduled_entries || [];
      const heats = tvState.heats || [];
      const heatMap = {};
      heats.forEach(h => { heatMap[h.id] = h; });
      const el = document.getElementById('ondeck-rows');
      const badgeEl = document.getElementById('ondeck-page-badge');

      if (!sched.length) {
        if (badgeEl) badgeEl.textContent = 'ALL UNDERWAY';
        el.innerHTML = `<div style="color:var(--muted);font-size:0.82rem;margin:auto;text-align:center">All scheduled slots are underway or finished.</div>`;
        return;
      }

      const ONDECK_PAGE_SIZE = 3;
      const totalPages = Math.max(1, Math.ceil(sched.length / ONDECK_PAGE_SIZE));
      const safePage = onDeckPageIndex % totalPages;
      const pageItems = sched.slice(safePage * ONDECK_PAGE_SIZE, (safePage + 1) * ONDECK_PAGE_SIZE);

      if (badgeEl) {
        badgeEl.textContent = totalPages > 1
          ? `SLOTS ${safePage * ONDECK_PAGE_SIZE + 1}–${Math.min(sched.length, (safePage + 1) * ONDECK_PAGE_SIZE)} OF ${sched.length}`
          : `${sched.length} UPCOMING`;
      }

      if (animateTransition) {
        el.classList.remove('roll-stage');
        void el.offsetWidth;
        el.classList.add('roll-stage');
      }

      el.innerHTML = pageItems.map(e => {
        const hObj = heatMap[e.heat_id];
        const chg = hObj && hObj.weight_changeover_before;
        const chgHtml = chg
          ? `<div style="font-size:0.68rem;color:var(--yellow);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">⚖️ Setup (+${chg.buffer_mins}m): ${chg.to_weights}</div>`
          : '';
        return `
          <div class="ondeck-item">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem;width:100%">
              <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><strong>Day ${e.heat_day_number || 1} · ${e.heat_start_time}</strong> · #${e.bib_number} ${e.full_display_name}</span>
              <span style="color:${e.division_color};font-weight:800;font-size:0.75rem;flex-shrink:0">${e.division_short_label} · Vol: ${e.volunteer_name || 'TBA'}</span>
            </div>
            ${chgHtml}
          </div>
        `;
      }).join('');
    }

    function tickLiveClocks() {
      const now = new Date();
      document.getElementById('wall-clock').textContent = now.toTimeString().slice(0, 8);
      const nowMs = Date.now();
      document.querySelectorAll('.racer-clock').forEach(el => {
        const startMs = parseInt(el.dataset.startedMs || '0', 10);
        if (startMs > 0) {
          el.textContent = formatElapsed(nowMs - startMs);
        }
      });
      document.querySelectorAll('.live-split-clock').forEach(el => {
        const startMs = parseInt(el.dataset.startedMs || '0', 10);
        const compSum = parseInt(el.dataset.completedSumMs || '0', 10);
        if (startMs > 0) {
          const splitElapsed = Math.max(0, (nowMs - startMs) - compSum);
          el.textContent = formatElapsed(splitElapsed);
        }
      });
    }

    fetchTvState();
    setInterval(tickLiveClocks, 500);
    setInterval(fetchTvState, 4000);
    setInterval(() => {
      if (rollPaused) return;
      rollTickSec++;
      const progEl = document.getElementById('tv-roll-progress');
      if (progEl) {
        const pct = Math.min(100, Math.round(((rollTickSec % ROLL_INTERVAL_SEC) / (ROLL_INTERVAL_SEC - 1)) * 100));
        progEl.style.width = `${pct}%`;
      }
      if (rollTickSec % ROLL_INTERVAL_SEC === 0) {
        racerPageIndex++;
        rotationIndex++;
        onDeckPageIndex++;
        renderLiveRacers(true);
        renderRotatingLeaderboard(true);
        renderOnDeck(true);
      }
    }, 1000);
  </script>
</body>
</html>
