services:
  - type: web
    name: taylor-fitness
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_PATH
        value: /data/gym.db
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: taylor-fitness-sqlite
      mountPath: /data
      sizeGB: 1
