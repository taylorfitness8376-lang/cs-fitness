<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS Fitness — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: Inter, sans-serif;
           display: flex; align-items: center; justify-content: center;
           min-height: 100vh; }
    .card { background: #0d0d0d; border: 1px solid #1a1a1a; border-radius: 12px;
            padding: 2.5rem; width: 360px; }
    .logo { display: block; width: 80px; margin: 0 auto 1.5rem; }
    h1 { font-family: 'Barlow Condensed', sans-serif; font-style: italic;
         font-weight: 800; font-size: 2rem; color: #3DFF4F; text-align: center;
         margin-bottom: 0.3rem; }
    .sub { color: #444; font-size: 0.8rem; text-align: center; margin-bottom: 1.8rem; }
    label { display: block; color: #666; font-size: 0.75rem; margin-bottom: 0.4rem;
            text-transform: uppercase; letter-spacing: 0.08em; }
    input[type=password] { width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a;
                           border-radius: 6px; padding: 0.7rem 1rem; color: #fff;
                           font-size: 0.95rem; margin-bottom: 1rem; }
    input[type=password]:focus { outline: none; border-color: #3DFF4F; }
    button { width: 100%; background: #3DFF4F; color: #000; border: none;
             border-radius: 6px; padding: 0.75rem; font-weight: 700;
             font-size: 0.95rem; cursor: pointer; }
    .error { color: #f66; font-size: 0.82rem; margin-bottom: 0.8rem; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/static/logo.jpg" alt="CS Fitness" />
    <h1>CS Fitness</h1>
    <p class="sub">Management Portal</p>
    <form method="post">
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autofocus />
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
